<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作学习平台 · 任务 · 计划 · 日志</title>
<meta name="description" content="单文件工作与学习管理平台：任务进度、自动日报周报、工作学习规划、长期学习区。数据保存在本机浏览器。">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMyZjZiZmYiLz48cGF0aCBkPSJNMTggMzQuNWw5LjUgOS41TDQ2IDIyIiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iNyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+PC9zdmc+">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  color-scheme:light;
  --bg:#f4f6fb; --bg-grad:radial-gradient(1200px 600px at 8% -10%,#e6edff 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#eafaf3 0%,transparent 55%);
  --panel:#ffffff; --panel-2:#f7f9fd; --panel-3:#eef2f9;
  --border:#e3e8f2; --border-strong:#d2dae8;
  --text:#0f172a; --text-2:#4c5871; --text-3:#8b96ad;
  --accent:#2f6bff; --accent-2:#1f4fd8; --accent-soft:#e9efff;
  --ok:#0ea76a; --ok-soft:#e5f8f0; --warn:#e08600; --warn-soft:#fdf3e2; --danger:#e5484d; --danger-soft:#fdecec; --purple:#7c5cff; --purple-soft:#f0edff;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px -18px rgba(16,24,40,.28);
  --shadow-lg:0 24px 60px -24px rgba(16,24,40,.35);
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#080c18; --bg-grad:radial-gradient(1100px 600px at 5% -10%,#16224a 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#10301f 0%,transparent 55%);
  --panel:#111829; --panel-2:#151d31; --panel-3:#1b2440;
  --border:#232d47; --border-strong:#2f3b5c;
  --text:#e9edf7; --text-2:#a9b3c9; --text-3:#6d7996;
  --accent:#5b8cff; --accent-2:#7ea3ff; --accent-soft:#18233f;
  --ok:#34d399; --ok-soft:#122a22; --warn:#fbbf24; --warn-soft:#2c2413; --danger:#f87171; --danger-soft:#2e1618; --purple:#a78bfa; --purple-soft:#231d3d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -20px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -28px rgba(0,0,0,.8);
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); background-image:var(--bg-grad); background-attachment:fixed;
  color:var(--text); font:14px/1.55 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 14px;
  background:color-mix(in srgb,var(--panel) 78%,transparent); backdrop-filter:blur(14px);
  border-right:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 8px}
.logo{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px;
  color:#fff;background:linear-gradient(140deg,var(--accent),var(--purple));box-shadow:0 8px 18px -8px var(--accent);
}
.brand-title{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand-sub{font-size:11.5px;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:3px;overflow:auto;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--text-2);
  font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:background .15s,color .15s;
}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85}
.nav-item:hover{background:var(--panel-3);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav-item.active svg{opacity:1}
.nav-item .nav-count{margin-left:auto;font-size:11px;font-weight:700;background:var(--panel-3);color:var(--text-2);padding:1px 7px;border-radius:20px}
.nav-item.active .nav-count{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.side-foot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:12px}
.side-meta{font-size:11.5px;color:var(--text-3);padding:0 6px;line-height:1.7}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;justify-content:space-between;
  padding:14px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
#pageTitle{font-size:19px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
#pageSub{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:9px}
.view-wrap{padding:20px 24px 90px;display:flex;flex-direction:column;gap:16px;max-width:1420px;width:100%}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--text-2);font-size:13px;font-weight:600;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--border-strong);color:var(--text);transform:translateY(-1px)}
.btn:active{transform:none}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 8px 18px -10px var(--accent)}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-3)}
.btn.ghost:hover{background:var(--panel-3);color:var(--text)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.tiny{padding:3px 7px;font-size:11.5px;border-radius:7px;font-weight:600}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--border);background:var(--panel);color:var(--text-2)}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.icon-btn svg{width:16px;height:16px}
.only-mobile{display:none}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3)}
.search input{width:230px;padding:8px 12px 8px 32px;border-radius:10px;border:1px solid var(--border);background:var(--panel);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:14px;font-weight:700}
.card-head .sub{font-size:12px;color:var(--text-3)}
.card-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-body{padding:16px}
.card-body.tight{padding:10px 12px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--text-3)}
.small{font-size:12px}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stats ---------- */
.stat{padding:14px 15px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.stat .label{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.stat .value{font-size:25px;font-weight:750;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .value small{font-size:12.5px;font-weight:600;color:var(--text-3);margin-left:3px}
.stat .foot{font-size:11.5px;color:var(--text-3)}
.stat .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.stat .ic svg{width:15px;height:15px}
.stat.ok .ic{background:var(--ok-soft);color:var(--ok)}
.stat.warn .ic{background:var(--warn-soft);color:var(--warn)}
.stat.purple .ic{background:var(--purple-soft);color:var(--purple)}

/* ---------- task rows ---------- */
.task{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel);padding:11px 13px;display:flex;gap:11px;align-items:flex-start;transition:.15s}
.task:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.task .chk{width:19px;height:19px;border-radius:6px;border:1.8px solid var(--border-strong);flex:none;margin-top:1px;display:grid;place-items:center;background:var(--panel)}
.task .chk:hover{border-color:var(--ok)}
.task .chk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.task .chk svg{width:13px;height:13px;opacity:0;stroke-width:3.4}
.task .chk.done svg{opacity:1}
.task.done .t-title{text-decoration:line-through;color:var(--text-3)}
.task-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.t-title{font-size:13.8px;font-weight:600;line-height:1.45;word-break:break-word}
.t-title:hover{color:var(--accent);cursor:pointer}
.t-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t-note{font-size:12px;color:var(--text-3);white-space:pre-wrap;word-break:break-word}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--panel-3);color:var(--text-2);font-weight:600}
.badge{font-size:11px;font-weight:650;padding:1.5px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.work{background:var(--accent-soft);color:var(--accent)}
.badge.study{background:var(--purple-soft);color:var(--purple)}
.badge.life{background:var(--ok-soft);color:var(--ok)}
.badge.todo{background:var(--panel-3);color:var(--text-2)}
.badge.doing{background:var(--accent-soft);color:var(--accent)}
.badge.paused{background:var(--warn-soft);color:var(--warn)}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.badge.due-soon{background:var(--warn-soft);color:var(--warn)}
.badge.overdue{background:var(--danger-soft);color:var(--danger)}
.badge.plain{background:var(--panel-3);color:var(--text-2)}
.pri{font-size:11px;font-weight:700;color:var(--text-3)}
.pri.high{color:var(--danger)} .pri.mid{color:var(--warn)} .pri.low{color:var(--text-3)}
.progress{height:6px;border-radius:20px;background:var(--panel-3);overflow:hidden;flex:1;min-width:60px}
.progress > i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width .3s}
.progress.ok > i{background:linear-gradient(90deg,var(--ok),#5fd6a2)}
.progress-bar{display:flex;align-items:center;gap:9px}
.progress-bar .pct{font-size:11.5px;font-weight:700;color:var(--text-2);width:36px;text-align:right;font-variant-numeric:tabular-nums}
.t-actions{display:flex;align-items:center;gap:4px;flex:none;opacity:0;transition:opacity .15s}
.task:hover .t-actions,.t-actions:focus-within{opacity:1}
.mini-btn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);border:1px solid transparent}
.mini-btn:hover{background:var(--panel-3);color:var(--text);border-color:var(--border)}
.mini-btn svg{width:14px;height:14px}
.mini-btn.on{color:var(--accent);background:var(--accent-soft)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-height:150px}
.col-head{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700}
.col-head .n{margin-left:auto;font-size:11.5px;color:var(--text-3);font-weight:700}
.col-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.col.drag-over{outline:2px dashed var(--accent);outline-offset:2px;background:var(--accent-soft)}
.mini-task{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.mini-task:hover{border-color:var(--border-strong)}
.mini-task .mt{font-size:12.8px;font-weight:600;line-height:1.4}

/* ---------- week plan ---------- */
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day-col{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;min-height:210px}
.day-col.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.day-col.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
.day-col.weekend .day-head{background:var(--panel-3)}
.day-head{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.day-head .dow{font-size:12.5px;font-weight:700}
.day-head .dnum{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.day-head .cnt{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:700}
.day-body{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;overflow:auto}
.chip{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:6px 8px;font-size:12.2px;line-height:1.4;cursor:grab;display:flex;gap:6px;align-items:flex-start}
.chip:hover{border-color:var(--border-strong)}
.chip.done{opacity:.55;border-left-color:var(--ok)}
.chip.study{border-left-color:var(--purple)}
.chip.life{border-left-color:var(--ok)}
.chip .ct{flex:1;word-break:break-word}
.chip .x{color:var(--text-3);font-size:13px;line-height:1;padding:0 2px}
.chip .x:hover{color:var(--danger)}
.pool{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.drop-hint{font-size:11.5px;color:var(--text-3);text-align:center;padding:14px 6px;border:1px dashed var(--border-strong);border-radius:8px}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:11px;padding:0 0 13px}
.tl-rail{display:flex;flex-direction:column;align-items:center;flex:none;width:14px}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.tl-line{flex:1;width:2px;background:var(--border);margin:4px 0 -4px}
.tl-item:last-child .tl-line{display:none}
.tl-time{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums;width:42px;flex:none;padding-top:2px}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:13px;font-weight:600}
.tl-text{font-size:12.5px;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.day-sep{display:flex;align-items:center;gap:10px;margin:4px 0 10px;font-size:12px;font-weight:700;color:var(--text-2)}
.day-sep::after{content:"";flex:1;height:1px;background:var(--border)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12px;font-weight:650;color:var(--text-2)}
.input,textarea.input,select.input{
  width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);outline:none;transition:.15s;font-size:13.5px
}
.input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:74px;line-height:1.6}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.seg button.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.seg button.active.work{color:var(--accent)} .seg button.active.study{color:var(--purple)} .seg button.active.life{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.check{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2)}
.check:hover{border-color:var(--border-strong)}
.check .box{width:17px;height:17px;border-radius:5px;border:1.8px solid var(--border-strong);display:grid;place-items:center;flex:none;background:var(--panel)}
.check .box svg{width:12px;height:12px;opacity:0;stroke-width:3.4}
.check.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.check.on .box svg{opacity:1}
.check.on .ctext{text-decoration:line-through;color:var(--text-3)}
.check .ctext{font-size:13px;flex:1;word-break:break-word}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:20px;background:var(--panel-3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2.5px solid var(--panel);box-shadow:var(--shadow);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2.5px solid var(--panel);cursor:pointer}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(10,15,30,.42);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:680px;animation:pop .18s ease-out}
.modal.wide{max-width:900px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15.5px;font-weight:700}
.modal-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:15px;max-height:calc(100vh - 210px);overflow:auto}
.modal-foot{display:flex;align-items:center;gap:9px;padding:13px 18px;border-top:1px solid var(--border);background:var(--panel-2);border-radius:0 0 18px 18px}
.sec-title{font-size:12px;font-weight:750;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--border)}

/* ---------- report ---------- */
.report-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.report-out{
  width:100%;min-height:540px;padding:16px 18px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--panel);font:12.9px/1.75 Consolas,"Cascadia Mono","SF Mono",Menlo,monospace;white-space:pre-wrap;
}
.md-preview{font-size:13.4px;line-height:1.8;word-break:break-word}

function streak(){

  if (!active(cur)) cur = addDays(cur,-1);

function sortTasks(list){
  const t = todayStr();
  const score = x => {
    let s = 0;
    if (x.status === 'doing') s -= 100;
    if (x.due && x.due < t) s -= 60;
    if (x.due === t) s -= 40;
    s += (PRIO_ORDER[x.priority]||1) * 12;
    if (x.due) s += (parseDay(x.due) - parseDay(t)) / 86400000 * 0.6;
    else s += 30;
    return s;
  };
  return list.slice().sort((a,b) => {
    if (isDone(a) !== isDone(b)) return isDone(a) ? 1 : -1;
    if (A.sort === 'due') {
      const ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
      return ad < bd ? -1 : ad > bd ? 1 : 0;
    }
    if (A.sort === 'created') return (b.createdAt||'') < (a.createdAt||'') ? -1 : 1;
    if (A.sort === 'priority') return (PRIO_ORDER[a.priority]||1) - (PRIO_ORDER[b.priority]||1);
    if (A.sort === 'progress') return pctOf(b) - pctOf(a);
    const sa = score(a), sb = score(b);
    if (sa !== sb) return sa - sb;
    return (a.createdAt||'') < (b.createdAt||'') ? 1 : -1;
  });
}
function filteredTasks(){

    if (A.f.status === 'done' && !isDone(t)) return false;
    if (A.f.status !== 'all' && A.f.status !== 'open' && A.f.status !== 'done' && t.status !== A.f.status) return false;
    if (A.f.type !== 'all' && t.type !== A.f.type) return false;
    if (A.f.priority !== 'all' && t.priority !== A.f.priority) return false;
    if (A.f.tag !== 'all' && !(t.tags||[]).includes(A.f.tag)) return false;
    if (A.f.range === 'week' && !((t.due && t.due >= addDays(todayStr(),-7) && t.due <= addDays(todayStr(),7)) || (t.plannedDate && t.plannedDate >= addDays(todayStr(),-7) && t.plannedDate <= addDays(todayStr(),7)))) return false;
    if (A.f.range === 'overdue' && !(t.due && t.due < todayStr() && !isDone(t))) return false;
    if (A.f.range === 'nodate' && (t.due || t.plannedDate)) return false;
    if (q){
      const cn = t.courseId && getCourse(t.courseId) ? getCourse(t.courseId).title : '';
      const hay = (t.title + ' ' + (t.notes||'') + ' ' + (t.tags||[]).join(' ') + ' ' + cn + ' ' + (t.subtasks||[]).map(s=>s.text).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  return sortTasks(list);
}

    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--panel-3)" stroke-width="5"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + circ.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>' +
    '<text x="' + cx + '" y="' + (cy + 4.6) + '" text-anchor="middle" font-size="' + (size <= 46 ? 10.5 : 13.5) + '" font-weight="700" fill="var(--text)">' + pct + '%</text></svg>';
}
function heatStudy(n){
  const days = rangeDays(addDays(todayStr(), -(n-1)), todayStr());
  const vals = days.map(d => studyMinutesOn(d));
  const max = Math.max(1, ...vals);
  const bars = days.map((d,i) => {
    const v = vals[i];
    const h = v ? Math.max(9, Math.round(v / max * 48)) : 4;
    return '<i class="' + (v ? '' : 'zero') + '" style="height:' + h + 'px" title="' + d + '：' + (v ? hours1(v) + ' 小时' : '没有学习记录') + '"></i>';
  }).join('');
  const labels = '<span>' + days[0].slice(5) + '</span><span>近 30 天</span><span>' + days[days.length-1].slice(5) + '</span>';
  return '<div class="heat-wrap"><div class="heat" role="img" aria-label="近 ' + n + ' 天学习投入">' + bars + '</div>' +
    '<div class="heat-labels">' + labels + '</div></div>';
}

function bar(p, ok){

function emptyBox(icon, text, action){

function typeBadge(type){ const t = TYPES[type] || TYPES.work; return '<span class="badge ' + type + '">' + t.label + '</span>'; }
function statusBadge(st){ return '<span class="badge ' + st + '"><span class="dot"></span>' + STATUSES[st].label + '</span>'; }
function dueBadge(t){
  if (!t.due) return '';

  const soon = !late && t.due <= addDays(todayStr(),2) && !isDone(t);
  const cls = late ? 'overdue' : (soon ? 'due-soon' : 'plain');
  const txt = fmtDateCN(t.due) + (late ? ' 逾期' : (t.due === todayStr() ? ' 今天' : ''));
  return '<span class="badge ' + cls + '">' + ic('clock') + txt + '</span>';

function taskRow(t, o){

  const subDone = subs.filter(s => s.done).length;

function miniTask(t){

function chip(t, o){

/* ---------- 图表 ---------- */
function chartTrend(n){
  const days = rangeDays(addDays(todayStr(), -(n-1)), todayStr());
  const doneArr = days.map(d => doneOn(d).length);
  const minArr = days.map(d => minutesOn(d));
  const maxDone = Math.max(1, ...doneArr);
  const maxH = Math.max(0.5, ...minArr.map(m => m/60));
  const W = 780, H = 250, L = 34, R = 44, T = 16, B = 34;
  const iw = W - L - R, ih = H - T - B;
  const step = iw / days.length;
  const yD = v => T + ih - (v / maxDone) * ih;
  const yH = v => T + ih - (v / maxH) * ih;
  const cx = i => L + step * i + step / 2;
  const bw = Math.min(26, step * 0.46);
  const grid = [0, 0.5, 1].map(f => {
    const y = T + ih - ih * f;
    return '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W-R) + '" y2="' + y.toFixed(1) + '" stroke="var(--border)" stroke-width="1"/>' +
      '<text x="' + (L-7) + '" y="' + (y+3.5).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="var(--text-3)">' + Math.round(maxDone*f) + '</text>' +
      '<text x="' + (W-R+7) + '" y="' + (y+3.5).toFixed(1) + '" font-size="10.5" fill="var(--text-3)">' + (maxH*f).toFixed(maxH < 3 ? 1 : 0) + 'h</text>';
  }).join('');
  const bars = days.map((d,i) => {
    const v = doneArr[i];
    const y = yD(v);
    const h = Math.max(v ? 2 : 0, T + ih - y);
    return '<g><rect x="' + (cx(i)-bw/2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" fill="var(--accent)" opacity="' + (d === todayStr() ? 0.95 : 0.72) + '"></rect>' +
      '<title>' + d + '：完成 ' + v + ' 项，投入 ' + hours1(minArr[i]) + ' 小时</title></g>';
  }).join('');
  const pts = days.map((d,i) => cx(i).toFixed(1) + ',' + yH(minArr[i]/60).toFixed(1));
  const line = '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const dots = days.map((d,i) => {
    const r = minArr[i] ? 3.4 : 2;
    return '<circle cx="' + cx(i).toFixed(1) + '" cy="' + yH(minArr[i]/60).toFixed(1) + '" r="' + r + '" fill="var(--panel)" stroke="var(--warn)" stroke-width="2">' +
      '<title>' + d + '：投入 ' + hours1(minArr[i]) + ' 小时</title></circle>';
  }).join('');
  const labels = days.map((d,i) => {
    if (days.length > 10 && i % 2 === 1) return '';
    const t = d === todayStr();
    return '<text x="' + cx(i).toFixed(1) + '" y="' + (H-12) + '" text-anchor="middle" font-size="10.5" fill="' + (t ? 'var(--accent)' : 'var(--text-3)') + '" font-weight="' + (t ? 700 : 400) + '">' + d.slice(5) + '</text>';
  }).join('');
  return '<div class="chart-box"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="近 ' + n + ' 天每日完成任务数与投入时长趋势">' +
    '<desc>柱状表示每天完成的任务数量，折线表示每天的投入小时数。</desc>' + grid + bars + line + dots + labels + '</svg></div>' +
    '<div class="legend mt-12"><span><i style="background:var(--accent)"></i>完成任务（项）</span><span><i style="background:var(--warn)"></i>投入时长（小时）</span></div>';
}

function taskLine(t){

function periodStats(from, to){

/* ---------- Markdown 渲染 ---------- */
function mdToHtml(md){
  const src = String(md||'').split('\n');
  const out = [];
  let ul = false, table = false, quote = false;
  const closeUl = () => { if (ul){ out.push('</ul>'); ul = false; } };
  const closeTable = () => { if (table){ out.push('</tbody></table>'); table = false; } };
  const closeQuote = () => { if (quote){ out.push('</blockquote>'); quote = false; } };
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>');
  src.forEach(raw => {
    const line = raw.replace(/\s+$/,'');
    if (/^\|/.test(line)){
      closeUl(); closeQuote();
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) return;
      if (!table){ out.push('<table>'); table = true; out.push('<thead><tr>' + cells.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>'); return; }
      out.push('<tr>' + cells.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>');
      return;
    }
    closeTable();
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))){
      closeUl(); closeQuote();
      out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>');
      return;
    }
    if (/^---+$/.test(line)){ closeUl(); closeQuote(); out.push('<hr>'); return; }
    if (/^>\s?/.test(line)){
      closeUl();
      if (!quote){ out.push('<blockquote>'); quote = true; }
      out.push('<div>' + inline(line.replace(/^>\s?/,'')) + '</div>');
      return;
    }
    if (/^\s*[-*]\s+/.test(line)){
      closeQuote();
      const txt = line.replace(/^\s*[-*]\s+/,'').replace(/^\[ \]\s*/,'☐ ').replace(/^\[x\]\s*/i,'☑ ');
      if (!ul){ out.push('<ul>'); ul = true; }
      out.push('<li>' + inline(txt) + '</li>');
      return;
    }
    if (/^\s{4,}\S/.test(line)){
      if (!ul){ out.push('<ul>'); ul = true; }
      out.push('<li style="list-style:none">' + inline(line.trim()) + '</li>');
      return;
    }
    closeUl(); closeQuote();
    if (line.trim()) out.push('<p>' + inline(line) + '</p>');
  });
  closeUl(); closeTable(); closeQuote();
  return out.join('\n');
}

function saveTaskForm(){
  const f = A.form;
  if (!f) return;
  const title = (f.title || '').trim();
  if (!title){ toast('请先填写任务内容', 'err'); const el = document.getElementById('fTitle'); if (el) el.focus(); return; }
  const tags = String(f.tags || '').split(/[\s,，、;；]+/).filter(Boolean);
  const est = (f.estimate === '' || f.estimate == null) ? null : Number(f.estimate);
  let id = f.id;
  if (!id){
    const t = createTask({ title, type:f.type, priority:f.priority, status:(f.status === 'done' ? 'doing' : f.status),
      due:f.due, plannedDate:f.plannedDate, estimate:est, tags, notes:f.notes, goalId:f.goalId, courseId:f.courseId || '',
      subtasks:f.subtasks.map(s => ({ id:s.id || uid(), text:s.text, done:!!s.done })), progress:0 });
    id = t.id;
  } else {
    patchTask(id, { title, type:f.type, priority:f.priority, due:f.due, plannedDate:f.plannedDate, estimate:est,
      tags, notes:f.notes, goalId:f.goalId, courseId:f.courseId || '', subtasks:f.subtasks.map(s => ({ id:s.id || uid(), text:s.text, done:!!s.done })) });
  }
  const target = clamp(Number(f.progress) || 0, 0, 100);
  if (target !== pctOf(getTask(id))) setProgress(id, target, f.id ? '手动调整进度' : '初始化进度', true);
  const t = getTask(id);
  if (f.status === 'done' && !isDone(t)) setStatus(id, 'done', null, true);
  else if (f.status !== 'done' && t.status !== 'doing' && f.status !== t.status) setStatus(id, f.status, null, true);
  if (f.logText && f.logText.trim()) addLog({ taskId:id, taskTitle:getTask(id).title, kind:'progress', text:f.logText.trim() });
  if (f.logMinutes) addManualTime(id, Number(f.logMinutes), '随进展记录补记');
  const wasNew = !f.id;
  save();
  closeModal();
  render();
  toast(wasNew ? '任务已创建' : '已保存修改', 'ok');
}

function copyText(text){
  const done = () => toast('已复制到剪贴板', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); done();
  } catch(e){ toast('复制失败，请手动选择文本复制', 'err'); }
}
function download(name, text, mime){
  try {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2500);
    toast('已开始下载：' + name, 'ok');
  } catch(e){ toast('下载失败：' + e.message, 'err'); }
}

  if (kind === 'daily') return key + ' 工作学习日志';
  if (kind === 'weekly') return key + ' 当周周报';
  return key + ' 月度总结';

function saveReportToLibrary(auto){
  const d = ensureDraft(false);
  const r = A.report;
  const key = r.kind === 'daily' ? r.date : r.kind === 'weekly' ? r.week : r.month;
  const ex = DB.reports.find(x => x.kind === r.kind && x.date === key);
  if (ex){
    if (auto) return;
    if (!confirm('该时段已有日志，是否用当前内容覆盖它？')) return;
    ex.content = d.text; ex.updatedAt = nowISO(); ex.title = reportTitle(r.kind, key);
  } else {
    DB.reports.unshift({ id:uid(), kind:r.kind, date:key, title:reportTitle(r.kind, key), content:d.text,
      createdAt:nowISO(), updatedAt:nowISO(), auto:!!auto });
  }
  save();
  toast(auto ? '已自动保存昨日日报到日志库' : '已存入日志库', 'ok');
  if (!auto) render();
}
function autoDaily(){
  if (DB.settings.autoDaily === false) return;
  const y = addDays(todayStr(), -1);
  const active = doneOn(y).length || minutesOn(y) || logsOn(y).length;
  if (active && !DB.reports.some(r => r.kind === 'daily' && r.date === y)){
    const keep = A.report;
    A.report = { kind:'daily', date:y, week:A.report.week, month:A.report.month, preview:false, sec:Object.assign({}, A.report.sec) };
    saveReportToLibrary(true);
    A.report = keep;
  }
  const ws = weekStartOf(todayStr());
  const dow = dowIndex(todayStr());
  if (dow === 0 && !isNaN(dow)){
    const lastWs = addDays(ws, -7);
    if (!DB.reports.some(r => r.kind === 'weekly' && r.date === lastWs) && doneInRange(lastWs, addDays(lastWs,6)).length){
      const keep = A.report;
      A.report = { kind:'weekly', date:A.report.date, week:lastWs, month:A.report.month, preview:false, sec:Object.assign({}, A.report.sec) };
      saveReportToLibrary(true);
      A.report = keep;
    }
  }
}

function importPick(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(String(fr.result));
        if (!data || typeof data !== 'object' || !Array.isArray(data.tasks)) throw new Error('文件格式不正确，请选择本平台导出的 JSON 备份');
        if (!confirm('导入会覆盖当前全部数据，确定继续吗？')) return;
        const theme = DB.settings.theme;
        DB = migrate(data);
        DB.settings.theme = theme || DB.settings.theme;
        DB.timer = null;
        save(); applyTheme(); render();
        toast('导入成功：' + DB.tasks.length + ' 个任务，' + DB.logs.length + ' 条记录', 'ok');
      } catch(e){ toast('导入失败：' + e.message, 'err'); }
    };
    fr.readAsText(file);
  };
  inp.click();
}

function toggleSidebar(){
  const sb = document.getElementById('sidebar'), sc = document.getElementById('scrim');
  const open = sb.classList.toggle('open');
  sc.hidden = !open;
}
function doAction(act, el, e){
  const id = el.dataset.id;
  switch(act){
    case 'go': A.view = el.dataset.view; render(); if (window.innerWidth <= 900) toggleSidebar(); break;
    case 'toggleMenu': toggleSidebar(); break;
    case 'newTask': openTaskModal(null, { plan: el.dataset.plan || '' }); break;
    case 'openTask': openTaskModal(id); break;
    case 'closeModal': closeModal(); break;
    case 'toggleDone': {
      const t = getTask(id); if (!t) break;
      setStatus(id, isDone(t) ? 'doing' : 'done');
      render(); break;
    }
    case 'bump': { const t = getTask(id); if (t) setProgress(id, pctOf(t) + 10, '手动 +10%'); render(); break; }
    case 'toggleTimer': {
      const tk = el.dataset.kind || 'task';
      if (timerRef(tk, id)) stopTimer(); else startTimer(tk, id);
      render(); break;
    }
    case 'stopTimer': stopTimer(); render(); break;
    case 'delTask': delTask(id); closeModal(); render(); break;
    case 'planToday': {
      const t = getTask(id); if (!t) break;
      patchTask(id, { plannedDate:todayStr() });
      addLog({ taskId:id, taskTitle:t.title, kind:'plan', text:'安排到 ' + todayStr() + ' 执行' });
      save(); render(); toast('已安排到今天', 'ok'); break;
    }
    case 'planTodayAll': {
      const pool = DB.tasks.filter(t => !t.archived && !isDone(t) && !t.plannedDate && t.status !== 'doing');
      if (!pool.length){ toast('待办池是空的', 'warn'); break; }
      if (!confirm('把待办池中 ' + pool.length + ' 项任务全部安排到今天？')) break;
      pool.forEach(t => { t.plannedDate = todayStr(); t.updatedAt = nowISO(); });
      save(); render(); toast('已安排 ' + pool.length + ' 项到今天', 'ok'); break;
    }
    case 'quickNote': {
      const box = document.getElementById('quickNote');
      const v = (box && box.value || '').trim();
      if (!v){ toast('先写点内容再记录吧', 'warn'); break; }
      addLog({ taskId:null, taskTitle:'', kind:'note', text:v });
      save(); render(); toast('已记录到今日时间线', 'ok'); break;
    }
    case 'taskView': A.taskView = el.dataset.v; render(); break;
    case 'archiveDone': {
      const done = DB.tasks.filter(t => isDone(t) && !t.archived);
      if (!done.length){ toast('没有已完成的任务', 'warn'); break; }
      if (!confirm('把 ' + done.length + ' 项已完成任务移入归档？（统计与报告仍会保留数据）')) break;
      done.forEach(t => t.archived = true);

    }
    case 'week': {
      const d = Number(el.dataset.d || 0);

      render(); break;
    }
    case 'unplan': { const t = getTask(id); patchTask(id, { plannedDate:'' }); save(); render(); break; }
    case 'newCourse': openCourseModal(null); break;

    case 'gMsDel': A.goalDraft.milestones = A.goalDraft.milestones.filter(x => x.id !== el.dataset.mid); paintGoalMs(); break;
    case 'saveGoal': saveGoal(); break;
    case 'mSubAdd': {
      const inp = document.getElementById('mSubInput');
      const v = (inp && inp.value || '').trim();
      if (!v){ toast('先填写子步骤内容', 'warn'); break; }
      A.form.subtasks.push({ id:uid(), text:v, done:false });
      paintSubs(); break;
    }
    case 'mSubToggle': {
      const s = A.form.subtasks.find(x => x.id === el.dataset.sid); if (!s) break;
      s.done = !s.done; paintSubs(); break;
    }
    case 'mSubDel': A.form.subtasks = A.form.subtasks.filter(x => x.id !== el.dataset.sid); paintSubs(); break;
    case 'formSeg': A.form[el.dataset.f] = el.dataset.v; paintTaskModal(); break;
    case 'formBump': {
      const to = el.dataset.to != null ? 100 : clamp(Number(A.form.progress) + Number(el.dataset.d), 0, 100);
      A.form.progress = to;
      if (to === 100) A.form.status = 'done';
      paintTaskModal(); break;
    }
    case 'saveTask': saveTaskForm(); break;
    case 'manualTime': {
      const mins = Number((document.getElementById('manualMin') || {}).value);
      const day = (document.getElementById('manualDate') || {}).value || todayStr();
      if (!mins){ toast('请输入补记的分钟数', 'warn'); break; }
      addManualTime(id, mins, '', day);
      paintTaskModal(); break;
    }
    case 'delTime': {
      const t = getTask(id); if (!t) break;
      t.timeLogs = (t.timeLogs||[]).filter(l => l.id !== el.dataset.lid);
      save(); paintTaskModal(); break;
    }
    case 'startTimerFromModal': startTimer('task', id); closeModal(); render(); break;
    case 'reportKind': A.report.kind = el.dataset.v; A.draft = null; render(); break;
    case 'reportStep': A.report.date = addDays(A.report.date, Number(el.dataset.d)); A.draft = null; render(); break;
    case 'reportWeekStep': A.report.week = addDays(A.report.week, Number(el.dataset.d)); A.draft = null; render(); break;
    case 'toggleSec': A.report.sec[el.dataset.k] = !secOn(el.dataset.k); A.draft = null; render(); break;
    case 'genReport': ensureDraft(true); paintReport(); toast('已按最新记录重新生成', 'ok'); break;
    case 'togglePreview': A.report.preview = !A.report.preview; render(); break;
    case 'copyReport': copyText(ensureDraft(false).text); break;
    case 'downloadReport': {
      const r = A.report;
      const key = r.kind === 'daily' ? r.date : r.kind === 'weekly' ? r.week : r.month;
      download(reportTitle(r.kind, key) + '.md', ensureDraft(false).text, 'text/markdown;charset=utf-8'); break;
    }
    case 'saveReport': saveReportToLibrary(false); break;
    case 'libKind': A.libKind = el.dataset.v; render(); break;
    case 'toggleLib': A.libOpen[el.dataset.id] = !A.libOpen[el.dataset.id]; render(); break;
    case 'copySaved': { const r = DB.reports.find(x => x.id === id); if (r) copyText(r.content); break; }
    case 'downloadSaved': { const r = DB.reports.find(x => x.id === id); if (r) download(r.title + '.md', r.content, 'text/markdown;charset=utf-8'); break; }
    case 'editSaved': openSavedModal(id); break;
    case 'saveSaved': {
      const r = DB.reports.find(x => x.id === id); const ta = document.getElementById('savedText');
      if (r && ta){ r.content = ta.value; r.updatedAt = nowISO(); save(); closeModal(); render(); toast('日志已更新', 'ok'); }
      break;
    }
    case 'delSaved': {
      const r = DB.reports.find(x => x.id === id); if (!r) break;
      if (!confirm('删除日志「' + r.title + '」？')) break;
      DB.reports = DB.reports.filter(x => x.id !== id); save(); render(); toast('日志已删除', 'warn'); break;
    }
    case 'exportJson': exportJson(); break;
    case 'importJson': importPick(); break;
    case 'exportMd': exportAllMd(); break;
    case 'demo': loadDemo(); break;
    case 'wipe': wipeAll(); break;
    case 'toggleAutoDaily': {
      DB.settings.autoDaily = DB.settings.autoDaily === false;
      save(); render(); toast(DB.settings.autoDaily ? '已开启自动日报' : '已关闭自动日报'); break;
    }
    case 'theme': DB.settings.theme = el.dataset.v; applyTheme(); save(); render(); break;
    case 'toggleTheme': {
      const dark = document.documentElement.dataset.theme === 'dark';
      DB.settings.theme = dark ? 'light' : 'dark';
      applyTheme(); save(); render(); break;
    }
    default: break;
  }
}
function onFieldChange(el){
  const act = el.dataset.act;
  if (act === 'filter'){ A.f[el.dataset.k] = el.value; render(); }
  else if (act === 'sort'){ A.sort = el.value; render(); }
  else if (act === 'reportDate'){ A.report.date = el.value || todayStr(); A.draft = null; render(); }
  else if (act === 'reportWeek'){ A.report.week = el.value ? weekStartOf(el.value) : weekStartOf(todayStr()); A.draft = null; render(); }
  else if (act === 'reportMonth'){ A.report.month = el.value || todayStr().slice(0,7); A.draft = null; render(); }
  else if (act === 'setting'){ DB.settings[el.dataset.k] = el.value; save(); }
  else if (act === 'form'){ if (A.form) A.form[el.dataset.f] = el.value; }
  else if (act === 'formSelect'){ if (A.form) A.form[el.dataset.k] = el.value; }
  else if (act === 'formRange'){ if (A.form){ A.form.progress = Number(el.value); const n = document.getElementById('progNum'); if (n) n.textContent = el.value + '%'; } }
  else if (act === 'goal'){ if (A.goalDraft) A.goalDraft[el.dataset.f] = el.value; }
  else if (act === 'goalSeg'){ if (A.goalDraft) A.goalDraft[el.dataset.f] = el.dataset.v; }
  else if (act === 'course'){ if (A.courseDraft) A.courseDraft[el.dataset.f] = el.value; }
  else if (act === 'courseSelect'){ if (A.courseDraft) A.courseDraft[el.dataset.k] = el.value; }
}
function bind(){
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    e.preventDefault();
    doAction(act, el, e);
  });
  ['input','change'].forEach(evt => document.addEventListener(evt, e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (['filter','sort','reportDate','reportWeek','reportMonth','setting','form','formSelect','formRange','goal','goalSeg','course','courseSelect'].includes(act)) onFieldChange(el);
  }));
  document.addEventListener('keydown', e => {
    const tgt = e.target;
    if (tgt && tgt.dataset && tgt.dataset.noteInput && e.key === 'Enter'){ e.preventDefault(); doAction('courseNote', tgt, e); return; }
    if (e.key === 'Enter' && tgt && tgt.id === 'cUnitInput'){ e.preventDefault(); doAction('cUnitAdd', tgt, e); return; }
    if (e.key === 'Escape'){
      if (A.modal) closeModal();
      else { const sb = document.getElementById('sidebar'); if (sb.classList.contains('open')) toggleSidebar(); }
      return;
    }
    if (A.modal && e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
      if (A.modal.type === 'task') saveTaskForm();
      else if (A.modal.type === 'goal') saveGoal();
      return;
    }
    if (A.modal) {
      if (e.key === 'Enter' && e.target && e.target.id === 'mSubInput'){ doAction('mSubAdd', document.getElementById('mSubInput'), e); }
      if (e.key === 'Enter' && e.target && e.target.id === 'gMsInput'){ doAction('gMsAdd', e.target, e); }
      return;
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
    if (typing) return;
    if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); openTaskModal(null, {}); }
    if (e.key === '/'){ e.preventDefault(); const s = document.getElementById('globalSearch'); if (s) s.focus(); }
  });
  document.getElementById('modalBackdrop').addEventListener('mousedown', e => { if (e.target.id === 'modalBackdrop') closeModal(); });
  document.getElementById('scrim').addEventListener('click', toggleSidebar);
  document.addEventListener('dragstart', e => {
    const el = e.target.closest('[draggable="true"]');
    if (!el) return;
    try { e.dataTransfer.setData('text/plain', el.dataset.id || ''); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
    el.style.opacity = '.45';
  });
  document.addEventListener('dragend', e => {
    const el = e.target.closest('[draggable="true"]');
    if (el) el.style.opacity = '';
    document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
  });
  document.addEventListener('dragover', e => {
    const zone = e.target.closest('[data-drop-status],[data-drop-date]');
    if (!zone) return;
    e.preventDefault();
    document.querySelectorAll('.drag-over').forEach(x => { if (x !== zone) x.classList.remove('drag-over'); });
    zone.classList.add('drag-over');
  });
  document.addEventListener('dragleave', e => {
    const zone = e.target.closest('[data-drop-status],[data-drop-date]');
    if (zone) zone.classList.remove('drag-over');
  });
  document.addEventListener('drop', e => {
    const zone = e.target.closest('[data-drop-status],[data-drop-date]');
    if (!zone) return;
    e.preventDefault();
    document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
    let id = '';
    try { id = e.dataTransfer.getData('text/plain'); } catch(err){ id = ''; }
    const t = getTask(id);
    if (!t) return;
    if (zone.dataset.dropStatus){
      if (t.status !== zone.dataset.dropStatus){ setStatus(t.id, zone.dataset.dropStatus); render(); }
    } else if (zone.dataset.dropDate !== undefined){
      const d = zone.dataset.dropDate;
      patchTask(t.id, { plannedDate:d });
      addLog({ taskId:t.id, taskTitle:t.title, kind:'plan', text: d ? ('排期到 ' + d) : '移出计划' });
      save(); render();
    }
  });
  const qn = document.getElementById('quickNote');
  if (qn) qn.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) doAction('quickNote', qn, e); });
}
function searchBox(){
  const w = document.getElementById('searchWrap');
  w.innerHTML = ic('search') + '<input id="globalSearch" placeholder="搜索任务…（按 / 聚焦）" autocomplete="off">';
  const inp = document.getElementById('globalSearch');
  inp.value = A.search;
  inp.addEventListener('input', () => {
    A.search = inp.value;
    if (A.search && A.view !== 'tasks') A.view = 'tasks';
    render();
  });
}

/* ---------- 启动 ---------- */
function init(){
  applyTheme();
  searchBox();
  const top = document.getElementById('topAddBtn'); if (top) top.innerHTML = ic('plus') + ' 新建任务';
  const th2 = document.getElementById('themeBtn2'); if (th2) th2.innerHTML = ic('moon');
  const mb = document.querySelector('[data-act="toggleMenu"]'); if (mb) mb.innerHTML = ic('menu');
  const sAdd = document.getElementById('sideAddIcon'); if (sAdd) sAdd.outerHTML = ic('plus');
  bind();
  render();
  autoDaily();
  paintTimer();
  setInterval(() => { if (DB.timer) paintTimer(); }, 1000);
  if (window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if ((DB.settings.theme||'auto') === 'auto') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
  }
  if (!storageOK) toast('浏览器本地存储不可用，数据可能无法保存，请在「数据」页导出备份', 'err');
  else if (!DB.tasks.length && !DB.settings.onboarded){
    DB.settings.onboarded = true; save();
    toast('欢迎使用！可以从「数据」页载入示例数据先体验一下', 'ok');
  }
}
init();
</script>
